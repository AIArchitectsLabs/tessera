name: Publish Website and Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "docs/public/**"
      - "scripts/docs-audit-public.ts"
      - "scripts/docs-check-style.ts"
      - "scripts/docs-prepare-github-pages.ts"
      - "package.json"
      - "bun.lock"
      - ".node-version"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build website and docs
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - id: pages
        uses: actions/configure-pages@v5

      - run: bun install --frozen-lockfile

      - run: bun run docs:check

      - run: bun run docs:export

      - name: Prepare website
        run: |
          mkdir -p site
          rsync -a --exclude package.json --exclude serve.ts apps/website/ site/

      - name: Add docs under website
        run: |
          mkdir -p site/docs
          unzip -q docs-export.zip -d site/docs

      - name: Configure docs base path
        run: bun run scripts/docs-prepare-github-pages.ts site/docs "${{ steps.pages.outputs.base_path }}/docs"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy website and docs
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
